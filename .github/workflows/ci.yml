name: CI — stock-service

# Gate de qualidade deste microsserviço: unit + integração (Postgres stock) + build.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-stock-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: stock-service
  NEW_RELIC_ENABLED: 'false'
  INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stock

jobs:
  test:
    name: Testes + build (stock)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Testes unitários
        run: yarn test

      - name: Testes de integração (DB stock)
        run: yarn test:integration

      - name: Build
        run: yarn build

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate SonarCloud
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage (stock-service)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stock-service-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
