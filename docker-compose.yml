services:
  stock:
    # Imagem local com Node 22 (evita pull da Docker Hub quando o registry timeout).
    # Para buildar pelo Dockerfile: docker compose build stock
    image: tech-challenge-api:latest
    pull_policy: never
    container_name: stock
    working_dir: /stock
    user: root
    command: sh -c "yarn install --ignore-engines && yarn start:dev"
    ports:
      - '3002:3000'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/stock
      - JWT_SECRET=${JWT_SECRET:-altere-este-segredo}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - SERVICE_NAME=stock-service
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-stock-service}
      - NEW_RELIC_LABELS=${NEW_RELIC_LABELS:-service:stock-service;component:stock}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - PORT=3000
    volumes:
      - .:/stock
      - stock_node_modules:/stock/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: stock-postgres
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock
    volumes:
      - stock-postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stock']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  stock-postgresdata:
  stock_node_modules:
