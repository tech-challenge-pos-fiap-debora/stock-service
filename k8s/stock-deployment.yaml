apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: stock
    app.kubernetes.io/component: stock-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock
        app.kubernetes.io/component: stock-service
        app.kubernetes.io/part-of: tech-challenge-pos-fiap

    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z stock-postgres 5432; do echo "aguardando stock-postgres..."; sleep 2; done
      containers:
        - name: stock
          image: stock-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: stock-config
            - secretRef:
                name: stock-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
